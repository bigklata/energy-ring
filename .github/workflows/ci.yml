name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # This job's `name` is the check-run name that branch protection matches on.
    # The `main` ruleset requires the context `ci`, so this string is load-bearing:
    # renaming it silently detaches the gate and leaves every PR waiting forever
    # for a status that will never be reported. Change it only together with the
    # ruleset (Settings -> Rules -> Rulesets -> main -> Require status checks).
    # The individual commands stay visible as step names below.
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open-mercato
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open-mercato
      # CI-only placeholders, never used outside this ephemeral job.
      JWT_SECRET: ci-only-placeholder-secret-not-for-production-32chars
      AUTH_SECRET: ci-only-placeholder-secret-not-for-production-32chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate
        run: yarn generate

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Design system check
        run: yarn ds:check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
