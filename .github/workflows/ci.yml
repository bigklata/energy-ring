name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # This job's `name` is the check-run name that branch protection matches on.
    # The `main` ruleset requires the context `ci`, so this string is load-bearing:
    # renaming it silently detaches the gate and leaves every PR waiting forever
    # for a status that will never be reported. Change it only together with the
    # ruleset (Settings -> Rules -> Rulesets -> main -> Require status checks).
    # The individual commands stay visible as step names below.
    #
    # SCOPE — deliberately infrastructure-free, and staying that way.
    #
    # This job runs only what needs no database, no running app and no browser:
    # generate, typecheck, lint, ds:check, unit tests (jest), build. It is the
    # `verify:unit` gate and nothing more.
    #
    # Do NOT add `db:migrate`, `test:integration:ephemeral` or Playwright here.
    # The team already runs three Open Mercato sandboxes; instance-level and
    # end-to-end verification happen there, and the evidence is pasted into the
    # Issue and the PR. See .ai/review-checklist.md, "Verification gate".
    #
    # Rationale: a 20h budget cannot absorb both the build-out of that CI
    # plumbing and ~8 extra minutes of wall clock on every one of ~27 PRs.
    name: ci
    runs-on: ubuntu-latest
    env:
      # No Postgres service: nothing in this job talks to a database. The URL is
      # a syntactically valid placeholder so config loaders that merely parse it
      # do not fail. If a step ever needs a real database, that step belongs on a
      # sandbox, not here.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open-mercato
      # CI-only placeholders, never used outside this ephemeral job.
      JWT_SECRET: ci-only-placeholder-secret-not-for-production-32chars
      AUTH_SECRET: ci-only-placeholder-secret-not-for-production-32chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate
        run: yarn generate

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Design system check
        run: yarn ds:check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
